<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>مسار</title>
    <script>
      // GitHub Pages SPA redirect — sends any 404 back to index.html
      // HashRouter makes this largely unnecessary but kept as safety net
      var l = window.location;
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1 + 1).join('/') + '/?p=/' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
    </script>
  </head>
</html>
